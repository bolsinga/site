name: push-and-prs-on-main

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: xcode-27

    strategy:
      fail-fast: false
      matrix:
        destination:
          - 'platform=macOS'
          - 'generic/platform=iOS Simulator'
          - 'generic/platform=tvOS Simulator'

    steps:
    - uses: actions/checkout@v7
    - name: sw_vers
      run: sw_vers
    - name: Available Xcodes
      run: ls /Applications | grep Xcode
    - name: Switch to Xcode 27
      run: sudo xcode-select -s "/Applications/Xcode_27.0.app/Contents/Developer"
    - name: Xcode - Accept License
      run: sudo xcodebuild -license accept
    - name: Xcode - First Launch
      run: xcodebuild -runFirstLaunch
    - name: Xcode Version
      run: xcodebuild -version
    - name: Show SDKs
      run: xcodebuild -showsdks
    - name: Show Destinations
      run: xcodebuild -scheme SiteApp -showdestinations
    - name: Build / Test
      run: xcodebuild test -verbose -skipPackagePluginValidation -scheme SiteApp -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
    - name: Build iOS / macOS / tvOS
      run: xcodebuild -verbose -skipPackagePluginValidation -scheme SiteApp -destination '${{ matrix.destination }}'
