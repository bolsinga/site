name: release-builds

on:
  release:
    branches: [ main ]
    types: [ published ]

jobs:
  build:

    runs-on: xcode-27

    strategy:
      fail-fast: false
      matrix:
        destination:
          - 'platform=macOS'
          - 'generic/platform=iOS Simulator'
          - 'generic/platform=tvOS Simulator'

    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-xcode
    - name: Build / Test
      if: matrix.destination == 'platform=macOS'
      run: xcodebuild test -verbose -skipPackagePluginValidation -scheme SiteApp -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
    - name: Build iOS / macOS / tvOS
      run: xcodebuild -verbose -skipPackagePluginValidation -scheme SiteApp -destination '${{ matrix.destination }}'

  format:
    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-xcode
    - name: swift-format
      run: |
        xcrun swift-format format --in-place --recursive Sources Shared/Sources Tests SiteWidgets
        if ! git diff --exit-code; then
          echo "::error::swift-format changed files. Run: xcrun swift-format format --in-place --recursive Sources Shared/Sources Tests SiteWidgets"
          exit 1
        fi
