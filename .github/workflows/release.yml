name: release-builds

on:
  release:
    branches: [ main ]
    types: [ published ]

jobs:
  build:

    runs-on: xcode-27

    strategy:
      fail-fast: false
      matrix:
        destination:
          - 'platform=macOS'
          - 'generic/platform=iOS Simulator'
          - 'generic/platform=tvOS Simulator'

    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-xcode
    - name: Build / Test
      if: matrix.destination == 'platform=macOS'
      run: xcodebuild test -verbose -skipPackagePluginValidation -scheme SiteApp -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
    - name: Test Shared
      if: matrix.destination == 'platform=macOS'
      run: swift test --package-path Shared
    - name: Test SiteKit
      if: matrix.destination == 'platform=macOS'
      run: swift test --package-path SiteKit
    - name: Test packages on iOS Simulator
      if: matrix.destination == 'generic/platform=iOS Simulator'
      timeout-minutes: 20
      uses: ./.github/actions/test-package-simulator
      with:
        platform: iOS Simulator
        device: iPhone
    - name: Test packages on tvOS Simulator
      if: matrix.destination == 'generic/platform=tvOS Simulator'
      timeout-minutes: 20
      uses: ./.github/actions/test-package-simulator
      with:
        platform: tvOS Simulator
        device: Apple TV
    - name: Build iOS / macOS / tvOS
      run: xcodebuild -verbose -skipPackagePluginValidation -scheme SiteApp -destination '${{ matrix.destination }}'

  format:
    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/check-format

  boundaries:
    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/check-boundaries
