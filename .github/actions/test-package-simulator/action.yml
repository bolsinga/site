name: Test packages on a simulator
description: Runs the Shared and SiteKit package tests on a simulator.

inputs:
  platform:
    description: The simulator platform, iOS Simulator or tvOS Simulator.
    required: true

runs:
  using: composite
  steps:
    - name: Test Shared and SiteKit
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        for package in Shared SiteKit; do
          cd "$GITHUB_WORKSPACE/$package"
          id=$(xcodebuild -scheme "$package-Package" -showdestinations 2>/dev/null \
            | grep "platform:$PLATFORM" | grep -v placeholder \
            | grep -m1 -oE 'id:[0-9A-F-]{36}' | cut -d: -f2)
          xcodebuild test -scheme "$package-Package" -skipPackagePluginValidation -destination "id=$id" CODE_SIGNING_ALLOWED=NO
        done
